name: Structured memory
on:
  push:
    branches: [shared-session-memory]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[sqlite,sentencepiece-tokenizer]" pytest pytest-asyncio pytest-cov pytest-timeout pytest-subtests pytest-mock
      - run: python -m pytest -q tests/unit/test_structured_handoff.py tests/unit/test_handoff_client.py tests/unit/test_section_policy.py tests/unit/test_handoff_bootstrap.py tests/test_sentencepiece_tokenizer.py
      - run: python tools/handoff/build_client.py
      - run: python dist/shared-memory.pyz --help
